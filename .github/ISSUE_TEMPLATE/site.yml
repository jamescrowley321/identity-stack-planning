name: Documentation site
description: A problem with the published site — rendering, navigation, a dead link, or the build.
title: "site: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://jamescrowley321.github.io/identity-stack-planning/...
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
